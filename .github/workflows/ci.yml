name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main. This workflow only triggered on pull_request, and the previous PR
  # was June 2026, so four months of coverage drift accumulated unnoticed and surfaced on
  # the next unrelated PR. Running on main means drift fails the commit that causes it.
  push:
    branches: [main]

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Backend lint
        run: |
          cd backend
          uv sync
          uv run ruff check .

      - name: Backend tests
        run: |
          cd backend
          uv run pytest --cov --cov-report=lcov:coverage.lcov

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        # fail_ci_if_error only covers Codecov rejecting the upload. A network
        # failure reaching Codecov at all throws before that flag is consulted,
        # and on 2026-10-05 a TLS handshake failure to codecov.io
        # ("write EPROTO ... ssl/tls alert handshake failure, SSL alert 40")
        # failed the job at the first upload, skipping every test step after it
        # and the release with them. Coverage reporting must never gate a build.
        continue-on-error: true
        with:
          files: backend/coverage.lcov
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Frontend typecheck
        run: |
          cd frontend
          npm ci
          npm run typecheck

      - name: Frontend unit tests
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload frontend unit coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: frontend/coverage/lcov.info
          flags: frontend-unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Frontend E2E tests (Playwright)
        run: |
          cd frontend
          npm run test:ct

      - name: Generate Playwright coverage report
        run: |
          cd frontend
          npx nyc report --reporter=lcov --report-dir=playwright-coverage --temp-dir=.nyc_output --check-coverage

      - name: Upload Playwright coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: frontend/playwright-coverage/lcov.info
          flags: frontend-playwright
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Frontend component tests (WTR)
        run: |
          cd frontend
          npm run test:wtr
