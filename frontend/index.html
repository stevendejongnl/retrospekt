<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥓</text></svg>">
  <!-- nginx (SSI) splices in the board's title and Open Graph tags; the stub is the fallback -->
  <!--# block name="og_empty" --><title>Retrospekt</title><!--# endblock -->
  <!--# include virtual="$og_meta_path" stub="og_empty" -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--retro-font-body);
      -webkit-font-smoothing: antialiased;
      background: var(--retro-bg-page);
    }


    #app {
      min-height: 100vh;
    }

    :root {
      color-scheme: light;
      --retro-font-body: 'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --retro-font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;

      /* Shape scale: three radii with a job. Pills (999px) are only for state: phase, counts, votes. */
      --retro-radius-sm: 10px;  /* buttons, inputs, small controls */
      --retro-radius-md: 14px;  /* cards, panels, popovers */
      --retro-radius-lg: 20px;  /* columns, dialogs */

      --retro-bg-page: #f3f5f8;
      --retro-bg-surface: #ffffff;
      --retro-timeline-ring: #ffffff;
      --retro-corner-bg: rgba(255, 255, 255, 0.6);
      --retro-corner-border: rgba(0, 0, 0, 0.05);
      --retro-bg-subtle: #eef1f5;
      --retro-bg-hover: #e8ecf2;
      --retro-text-primary: #141a24;
      --retro-text-secondary: #465068;
      --retro-text-muted: #5a6479;
      --retro-text-disabled: #9aa3b4;
      --retro-border-default: #dde2ea;
      --retro-border-subtle: #e8ecf2;
      --retro-border-strong: #c4cbd6;
      --retro-accent: #b45309;
      --retro-accent-hover: #9a4a07;
      --retro-accent-ink: #9a4a07;       /* the accent used as text */
      --retro-accent-contrast: #ffffff;  /* label on an accent fill */
      --retro-accent-tint: #fff1dc;
      --retro-accent-border: #b45309;    /* outline of an accent button */
      --retro-phase-collecting-bg: color-mix(in srgb, var(--retro-col-3) 24%, transparent);
      --retro-phase-collecting-text: var(--retro-text-primary);
      --retro-phase-discussing-bg: var(--retro-accent-tint);
      --retro-phase-discussing-text: var(--retro-accent-ink);
      --retro-phase-closed-bg: var(--retro-bg-subtle);
      --retro-phase-closed-text: var(--retro-text-secondary);
      --retro-error: #dc2626;
      --retro-share-bg: #eef1f5;
      --retro-share-border: #dde2ea;
      --retro-share-text: #465068;
      --retro-facilitator-bg: #fff1dc;
      --retro-facilitator-border: #f0c88e;
      --retro-facilitator-text: #9a4a07;
      --retro-overlay-bg: rgba(40, 30, 20, 0.18);
      --retro-scrim-bg: rgba(20, 26, 36, 0.28);
      --retro-check-bg: rgba(255, 255, 255, 0.55);
      --retro-check-border: rgba(0, 0, 0, 0.05);
      --retro-check-box-border: rgba(0, 0, 0, 0.2);
      --retro-timer-ok: oklch(0.45 0.13 150);
      --retro-timer-late: oklch(0.5 0.18 25);
      --retro-input-bg: rgba(255, 255, 255, 0.7);
      --retro-input-border: rgba(0, 0, 0, 0.08);
      --retro-error-ink: oklch(0.5 0.2 25);
      --retro-error-border: oklch(0.55 0.2 25);
      --retro-card-shadow: rgba(20, 26, 36, 0.06);

      /* Column colours (pastel, never used for text) and the ink for labels on them */
      --retro-col-1: #8fd3b0;
      --retro-col-2: #f3c98a;
      --retro-col-3: #9cc3f0;
      --retro-col-ink: #141a24;
      --retro-col-tint: 12%;
      --retro-strong-bg: #141a24;        /* dark button, e.g. Close session */
      --retro-strong-ink: #ffffff;

      /* Surfaces: flat, with a hairline. Only things that float carry --retro-shadow-float. */
      --retro-glass-bg-light: #f7f8fb;
      --retro-glass-bg-medium: #ffffff;
      --retro-glass-bg-strong: #ffffff;
      --retro-glass-blur-light: 0px;
      --retro-glass-blur-medium: 0px;
      --retro-glass-blur-strong: 0px;
      --retro-glass-border: #dde2ea;
      --retro-glass-shadow: 0 4px 14px rgba(20, 26, 36, 0.06);
      --retro-shadow-float: 0 14px 36px rgba(20, 26, 36, 0.18);
      --retro-shadow-notification: 0 12px 36px rgba(120, 80, 40, 0.16);
    }

    [data-theme='dark'] {
      color-scheme: dark;
      --retro-bg-page: #0e1218;
      --retro-bg-surface: #171d28;
      --retro-timeline-ring: oklch(0.16 0.005 60);
      --retro-corner-bg: rgba(255, 255, 255, 0.06);
      --retro-corner-border: rgba(255, 255, 255, 0.08);
      --retro-bg-subtle: #1d2431;
      --retro-bg-hover: #232b3a;
      --retro-text-primary: #e8ecf3;
      --retro-text-secondary: #a9b3c4;
      --retro-text-muted: #8f9aae;
      --retro-text-disabled: #5d687c;
      --retro-border-default: #263040;
      --retro-border-subtle: #1c2331;
      --retro-border-strong: #3a465a;
      --retro-accent: #f59e0b;
      --retro-accent-hover: #fbbf24;
      --retro-accent-ink: #fbbf24;
      --retro-accent-contrast: #14181f;
      --retro-accent-tint: rgba(245, 158, 11, 0.15);
      --retro-accent-border: rgba(245, 158, 11, 0.55);
      --retro-phase-collecting-bg: color-mix(in srgb, var(--retro-col-3) 24%, transparent);
      --retro-phase-collecting-text: var(--retro-text-primary);
      --retro-phase-discussing-bg: var(--retro-accent-tint);
      --retro-phase-discussing-text: var(--retro-accent-ink);
      --retro-phase-closed-bg: var(--retro-bg-subtle);
      --retro-phase-closed-text: var(--retro-text-secondary);
      --retro-error: #f87171;
      --retro-share-bg: #1d2431;
      --retro-share-border: #263040;
      --retro-share-text: #a9b3c4;
      --retro-facilitator-bg: #2b2312;
      --retro-facilitator-border: #6b4a10;
      --retro-facilitator-text: #fbbf24;
      --retro-overlay-bg: rgba(0, 0, 0, 0.45);
      --retro-scrim-bg: rgba(0, 0, 0, 0.5);
      --retro-check-bg: rgba(255, 255, 255, 0.03);
      --retro-check-border: rgba(255, 255, 255, 0.06);
      --retro-check-box-border: rgba(255, 255, 255, 0.2);
      --retro-timer-ok: oklch(0.78 0.14 150);
      --retro-timer-late: oklch(0.78 0.16 25);
      --retro-input-bg: rgba(255, 255, 255, 0.04);
      --retro-input-border: rgba(255, 255, 255, 0.1);
      --retro-error-ink: oklch(0.8 0.14 25);
      --retro-error-border: oklch(0.7 0.18 25);
      --retro-card-shadow: rgba(0, 0, 0, 0.35);

      --retro-col-1: #6fd0a0;
      --retro-col-2: #f0c070;
      --retro-col-3: #7fb2ee;
      --retro-col-ink: #0e1218;
      --retro-strong-bg: #e8ecf3;
      --retro-strong-ink: #141a24;

      --retro-glass-bg-light: #131822;
      --retro-glass-bg-medium: #171d28;
      --retro-glass-bg-strong: #121721;
      --retro-glass-blur-light: 0px;
      --retro-glass-blur-medium: 0px;
      --retro-glass-blur-strong: 0px;
      --retro-glass-border: #263040;
      --retro-glass-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      --retro-shadow-float: 0 14px 36px rgba(0, 0, 0, 0.55);
      --retro-shadow-notification: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    [data-brand='cs'] {
      --retro-accent: #2f3f5b;
      --retro-accent-hover: #51678c;
      --retro-accent-ink: #2f3f5b;
      --retro-accent-contrast: #ffffff;
      --retro-accent-border: #2f3f5b;
      --retro-accent-tint: #edf0f4;
      --retro-strong-bg: #2f3f5b;
      --retro-strong-ink: #ffffff;

      --retro-bg-page: #f2f5f7;
      --retro-bg-surface: #ffffff;
      --retro-timeline-ring: #ffffff;
      --retro-corner-bg: rgba(255, 255, 255, 0.6);
      --retro-corner-border: rgba(0, 0, 0, 0.05);
      --retro-bg-subtle: #f2f5f7;
      --retro-bg-hover: #e8ecf0;

      --retro-text-primary: #2f3f5b;
      --retro-text-secondary: #323d5b;
      --retro-text-muted: #767676;
      --retro-text-disabled: #b4b4b4;

      --retro-border-default: #e3e3e3;
      --retro-border-subtle: #f2f5f7;
      --retro-border-strong: #b4b4b4;

      --retro-phase-collecting-bg: color-mix(in srgb, var(--retro-col-3) 24%, transparent);
      --retro-phase-collecting-text: var(--retro-text-primary);
      --retro-phase-discussing-bg: var(--retro-accent-tint);
      --retro-phase-discussing-text: var(--retro-accent-ink);
      --retro-phase-closed-bg: var(--retro-bg-subtle);
      --retro-phase-closed-text: var(--retro-text-secondary);

      --retro-error: #c81a47;

      --retro-share-bg: #edf0f4;
      --retro-share-border: #b4b4b4;
      --retro-share-text: #2f3f5b;

      --retro-facilitator-bg: #edf0f4;
      --retro-facilitator-border: #b4b4b4;
      --retro-facilitator-text: #2f3f5b;

      --retro-overlay-bg: rgba(40, 30, 20, 0.18);
      --retro-scrim-bg: rgba(20, 26, 36, 0.28);
      --retro-check-bg: rgba(255, 255, 255, 0.55);
      --retro-check-border: rgba(0, 0, 0, 0.05);
      --retro-check-box-border: rgba(0, 0, 0, 0.2);
      --retro-timer-ok: oklch(0.45 0.13 150);
      --retro-timer-late: oklch(0.5 0.18 25);
      --retro-input-bg: rgba(255, 255, 255, 0.7);
      --retro-input-border: rgba(0, 0, 0, 0.08);
      --retro-error-ink: oklch(0.5 0.2 25);
      --retro-error-border: oklch(0.55 0.2 25);
      --retro-card-shadow: rgba(47, 63, 91, 0.12);
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script src="/env.js?v=1" data-cfasync="false"></script>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
