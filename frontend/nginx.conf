# Link-preview crawlers (and checkers like opengraph.xyz, which send a plain Chrome UA)
# never run JS, so the SPA's static <head> is all they would see. Instead of sniffing user
# agents, nginx splices per-board Open Graph tags into index.html for EVERY client with SSI
# (see the include in index.html and routers/share.py). The tags come from the backend; a
# failing/slow/404 subrequest falls back to the empty stub, so the app always loads.
map $request_uri $og_meta_path {
    default "/_og/none";
    "~^/(\?.*)?$" "/_og/meta";
    "~^/session/(?<og_session_id>[^/?]+)/?(\?.*)?$" "/_og/sessions/$og_session_id/meta";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    ssi on;

    # Proxy API to backend — disable buffering for SSE streams
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
    }

    # env.js is runtime-generated — must never be cached
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    # Tag fragments for the SSI include in index.html. Short timeouts: a slow backend must
    # delay the page by seconds at most, never hang it like the SSE-friendly /api/ block would.
    location /_og/ {
        internal;
        rewrite ^/_og/(.*)$ /api/v1/$1 break;
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /_og/none {
        internal;
        return 200 "";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
