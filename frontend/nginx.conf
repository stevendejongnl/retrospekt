# Link-preview crawlers never run JS, so the SPA's static <head> is all they would
# see. They get a tiny Open Graph page from the backend instead (see routers/share.py).
map $http_user_agent $link_preview_bot {
    default 0;
    "~*(slackbot|facebookexternalhit|facebot|twitterbot|linkedinbot|whatsapp|discordbot|telegrambot|skypeuripreview|microsoftpreview|teams|mattermost|signal|applebot|pinterest|embedly|redditbot|googlebot|bingbot|iframely|vkshare|viber|line-poker|google-pagerenderer)" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend — disable buffering for SSE streams
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://${BACKEND_HOST}:8000;
    }

    # env.js is runtime-generated — must never be cached
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
        try_files $uri =404;
    }

    # Shared board URL: bots get the Open Graph page, people get the SPA
    location ~ ^/session/([^/]+)/?$ {
        error_page 418 = @session_preview;
        if ($link_preview_bot) { return 418; }
        try_files /index.html =404;
    }

    location @session_preview {
        rewrite ^/session/([^/]+)/?$ /api/v1/sessions/$1/preview break;
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Home page, same treatment
    location = / {
        error_page 418 = @home_preview;
        if ($link_preview_bot) { return 418; }
        try_files /index.html =404;
    }

    location @home_preview {
        rewrite ^ /api/v1/preview break;
        proxy_pass http://${BACKEND_HOST}:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
